<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="robots" content="noindex" />
    <title>Updating Stock Stickies</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b12; color: #f6f7fb; }
      main { width: min(88vw, 28rem); padding: 2rem; text-align: center; border: 1px solid #272c39; border-radius: 1.25rem; background: #111621; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { margin: 0; color: #aeb6c7; line-height: 1.5; }
      button { margin-top: 1.25rem; padding: .8rem 1rem; border: 0; border-radius: .75rem; background: #f2d35c; color: #151515; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Updating Stock Stickies</h1>
      <p id="status">Clearing the old app version…</p>
      <button id="retry" type="button" hidden>Try again</button>
    </main>
    <script>
      const status = document.getElementById('status')
      const retry = document.getElementById('retry')

      async function resetApp() {
        retry.hidden = true
        status.textContent = 'Clearing the old app version…'
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations()
            await Promise.all(registrations.map((registration) => registration.unregister()))
          }
          if ('caches' in window) {
            const keys = await caches.keys()
            await Promise.all(keys.map((key) => caches.delete(key)))
          }
          status.textContent = 'Update ready. Reopening the app…'
          window.location.replace(`/?fresh=${Date.now()}`)
        } catch {
          status.textContent = 'The automatic reset was blocked. Remove the Home Screen app, then reinstall it from Safari.'
          retry.hidden = false
        }
      }

      retry.addEventListener('click', resetApp)
      resetApp()
    </script>
  </body>
</html>
